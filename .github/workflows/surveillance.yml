name: Surveillance stock

on:
  schedule:
    - cron: "2-59/5 * * * *"   # toutes les 5 min (GitHub peut retarder)
  workflow_dispatch:
    inputs:
      test:
        description: "Recevoir un message de test avec le statut actuel"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: surveillance-stock
  cancel-in-progress: false

jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Vérifier les produits
        env:
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          TEST: ${{ inputs.test && '1' || '0' }}
        run: python3 check_stock.py

      - name: Sauvegarder l'état
        if: always()
        run: |
          [ -f etat.json ] || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add etat.json
          git diff --cached --quiet || (git commit -m "Mise à jour de l'état" && git push)
